# GitHub Actions: Build Pixel 4XL (coral) Android 13 内核
# 含 BakaSU (KernelSU fork) + SUSFS v2.3.0 + AnyKernel3 卡刷包打包
#
# 触发:
#   - pull_request:  构建 + 上传 artifact
#   - push main:     构建 + 上传 artifact
#   - tag v*.*.*:    构建 + 上传 + 自动创建 GitHub Release
#   - workflow_dispatch: 手动,可选输入仓库 URL
#
# 输出:
#   - new-boot.img                        boot 镜像(保留原厂 v2 DTB)
#   - AnyKernel3-coral-<timestamp>.zip    TWRP 卡刷包
#
# 关键设计:
#   - 单 job(Sequential),因为所有步骤都在同一个 runner 上跑效率最高
#   - clang 11.0.1 直接从 LLVM 官方 GitHub release 下载
#   - ccache 用 actions/cache@v4 跨 run 复用
#   - 错误步骤 continue-on-error + 总结日志输出,避免 job 一报错什么都看不到

name: Build coral kernel (GKI + BakaSU + SUSFS)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-coral.yml'
      - 'kernel/**'
      - 'patches/**'
      - 'scripts/**'
      - 'anykernel3/**'
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'coral 内核分支(msnx/KernelSU-Pixel4XL 只提供 main)'
        default: 'main'
        type: choice
        options:
          - main
      kernel_repo:
        description: 'coral 内核仓库 URL(默认 msnx/KernelSU-Pixel4XL,已预集成 KSU)'
        default: 'https://github.com/msnx/KernelSU-Pixel4XL'
        type: string
      kernelsu_repo:
        description: 'KernelSU (BakaSU) 仓库'
        default: 'https://github.com/tiann/KernelSU'
        type: string
      kernelsu_branch:
        description: 'KernelSU 分支'
        default: 'main'
        type: string
      susfs_repo:
        description: 'SUSFS 仓库'
        default: 'https://github.com/sidex15/susfs'
        type: string
      anykernel3_repo:
        description: 'AnyKernel3 模板仓库(留空用 osm0sis/AnyKernel3)'
        default: ''
        type: string
      stock_factory:
        description: 'Pixel 4XL 工厂镜像 URL'
        default: 'https://dl.google.com/dl/android/aosp/coral-sp2a.220505.008-factory-b1d35049.zip'
        type: string

# 写权限仅给 release(后续 tag release 会用)
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 路径
  WORK_DIR: ${{ github.workspace }}/work
  KERNEL_DIR: ${{ github.workspace }}/work/kernel/google-coral
  OUT_DIR: ${{ github.workspace }}/output
  CLANG_DIR: ${{ github.workspace }}/work/clang
  CCACHE_DIR: ${{ github.workspace }}/.ccache

  # 工具链版本
  CLANG_VERSION: '11.0.1'
  SUSFS_VERSION: '2.3.0'

  # ccache
  CCACHE_MAXSIZE: '30G'

jobs:
  build:
    name: Build kernel with BakaSU + SUSFS
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      # ============================================================
      # Set up job — 检出源码 + 构建编译环境
      # ============================================================
      - name: 检出 fork 仓库源码
        uses: actions/checkout@v4
        with:
          path: ${{ github.workspace }}
          fetch-depth: 1

      - name: 构建编译内核环境 & 创建工作目录
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget xz-utils unzip zip cpio rsync \
            bc bison build-essential ccache flex \
            libssl-dev libelf-dev dwarves \
            xxd python3 python2 \
            libtinfo5 zlib1g-dev binutils-aarch64-linux-gnu \
            device-tree-compiler
          # 大文件稀疏 checkout 优化
          git config --global core.sparseCheckout true
          git config --global advice.detachedHead false

          mkdir -p $WORK_DIR $OUT_DIR $CCACHE_DIR
          echo "WORK_DIR=$WORK_DIR"
          echo "KERNEL_DIR=$KERNEL_DIR"
          echo "OUT_DIR=$OUT_DIR"
          df -h $WORK_DIR

      # ============================================================
      # 下载 clang 11.0.1 (LLVM 官方 release)
      # ============================================================
      - name: 下载 clang ${{ env.CLANG_VERSION }} 工具链 (LLVM 官方 release)
        run: |
          mkdir -p $CLANG_DIR
          cd "$(dirname "$CLANG_DIR")"

          CLANG_TARBALL="clang+llvm-${CLANG_VERSION}-x86_64-linux-gnu-ubuntu-16.04.tar.xz"
          CLANG_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${CLANG_VERSION}/${CLANG_TARBALL}"

          echo "下载: $CLANG_URL"
          wget --progress=dot:giga "$CLANG_URL" 2>&1 | tail -n 3
          ls -lh "$CLANG_TARBALL"

          echo "解压到 $CLANG_DIR ..."
          tar -xJf "$CLANG_TARBALL" -C "$CLANG_DIR" --strip-components=1
          rm "$CLANG_TARBALL"

          # 验证
          $CLANG_DIR/bin/clang --version
          $CLANG_DIR/bin/ld.lld --version 2>&1 | head -n 1 || true

      # ============================================================
      # 集成 BakaSU (KernelSU 分支,内置 su)
      # ============================================================
      - name: 集成 BakaSU (KernelSU 分支)
        id: bakasu
        env:
          KSU_REPO: ${{ inputs.kernelsu_repo || secrets.BAKASU_REPO || 'https://github.com/tiann/KernelSU' }}
          KSU_BRANCH: ${{ inputs.kernelsu_branch || secrets.BAKASU_BRANCH || 'main' }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch || 'main' }}
          # coral 内核在 community 仓库 msnx/KernelSU-Pixel4XL (Pixel 4 / 4 XL 共用 "floral" 内核)。
          # 上游 AOSP `android.googlesource.com/kernel/google/coral/` 不存在(404);
          # 官方遗留分支是 `device/google/coral-kernel` 而非 kernel 树,无法直接 git clone。
          KERNEL_REPO: ${{ inputs.kernel_repo || secrets.CORAL_KERNEL_REPO || 'https://github.com/msnx/KernelSU-Pixel4XL' }}
        run: |
          cd "$WORK_DIR"

          # 1. 拉取 KernelSU/BakaSU 源码
          echo "Clone KernelSU: $KSU_REPO @ $KSU_BRANCH"
          git clone --depth=1 --branch "$KSU_BRANCH" "$KSU_REPO" KernelSU
          KSU_HEAD=$(git -C KernelSU rev-parse --short HEAD)
          echo "KernelSU HEAD: $KSU_HEAD"

          # 2. 拉取 coral 内核源码(msnx/KernelSU-Pixel4XL 已内置 KSU,这里克隆的是其源代码)
          echo "Clone coral kernel: $KERNEL_REPO @ $KERNEL_BRANCH"
          git clone --depth=1 --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"
          CORAL_HEAD=$(git -C "$KERNEL_DIR" rev-parse --short HEAD)
          echo "coral HEAD: $CORAL_HEAD"

          # 3. 备份并改写 build.config(去掉私有 device tree)
          cd "$KERNEL_DIR"
          cp build/build.config.coral build/build.config.coral.bak 2>/dev/null || \
            cp build/build.config.floral build/build.config.floral.bak 2>/dev/null || true
          if grep -q "private/google-modules" build/build.config.coral 2>/dev/null || \
             grep -q "private/google-modules" build/build.config.floral 2>/dev/null; then
            echo "WARN: build.config.coral/floral 引用私有 device tree,改用 build.config.gki"
          fi
          if [[ -f build/build.config.gki ]]; then
            ln -sf build/build.config.gki build.config
          else
            # fallback: 写一个最小 GKI 配置(msnx 仓库的 build.config.* 通常依赖
            # private/msm-google,这里直接走 GKI + floral_defconfig 路径,
            # 对应 Pixel 4 / 4 XL 共用的 "floral" defconfig)。
            printf '%s\n' \
              '. ${ROOT_DIR}/build.config.common' \
              '. ${ROOT_DIR}/build.config.gki' \
              'DEFCONFIG=floral_defconfig' \
              > build.config
          fi
          cat build.config

          # 4. 应用 KernelSU/BakaSU 的 patch(如果有)
          #    注意:msnx/KernelSU-Pixel4XL 仓库已经预集成了 KernelSU,
          #    这里的 patch 应用步骤会因 "already applied" 全部 skip,不会破坏构建。
          KSU_PATCH_DIR="$WORK_DIR/KernelSU/kernel"
          if [[ -d "$KSU_PATCH_DIR" ]]; then
            mapfile -t KSU_PATCHES < <(find "$KSU_PATCH_DIR" \( -name "*.patch" -o -name "*.diff" \) | sort)
            if [[ ${#KSU_PATCHES[@]} -gt 0 ]]; then
              echo "应用 ${#KSU_PATCHES[@]} 个 KSU patch ..."
              for p in "${KSU_PATCHES[@]}"; do
                echo "  Apply: $(basename "$p")"
                if git apply --check "$p" 2>/dev/null; then
                  git apply "$p" && echo "    OK"
                else
                  echo "    3-way ..."
                  git apply --3way "$p" 2>/dev/null && echo "    3-way OK" || \
                    echo "    skip(冲突,继续)"
                fi
              done
            else
              echo "KernelSU/kernel 没找到 patch 文件,尝试直接 cp 源码"
              cp -rv "$KSU_PATCH_DIR"/* "$KERNEL_DIR/" 2>/dev/null || true
            fi
          fi

          echo "kernelsu-head=$KSU_HEAD" >> "$GITHUB_OUTPUT"
          echo "coral-head=$CORAL_HEAD" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 集成 SUSFS v2.3.0 + 非 GKI inline hooks
      # ============================================================
      - name: 集成 SUSFS v${{ env.SUSFS_VERSION }} 内核补丁 + 非 GKI inline hooks
        id: susfs
        env:
          SUSFS_REPO: ${{ inputs.susfs_repo || secrets.SUSFS_REPO || 'https://github.com/sidex15/susfs' }}
        run: |
          cd "$WORK_DIR"

          # 1. clone SUSFS(尝试指定 tag/tag 失败就 clone 默认分支)
          echo "Clone SUSFS: $SUSFS_REPO @ v${SUSFS_VERSION}"
          if ! git clone --depth=1 --branch "v${SUSFS_VERSION}" "$SUSFS_REPO" susfs 2>/dev/null; then
            git clone --depth=1 --branch "${SUSFS_VERSION}" "$SUSFS_REPO" susfs 2>/dev/null || \
              git clone --depth=1 "$SUSFS_REPO" susfs
          fi
          SUSFS_HEAD=$(git -C susfs rev-parse --short HEAD)
          echo "SUSFS HEAD: $SUSFS_HEAD"

          # 2. 应用 SUSFS patches
          mapfile -t SUSFS_PATCHES < <(find "$WORK_DIR/susfs" -name "*.patch" -type f 2>/dev/null | sort)
          if [[ ${#SUSFS_PATCHES[@]} -gt 0 ]]; then
            echo "应用 ${#SUSFS_PATCHES[@]} 个 SUSFS patch ..."
            (
              cd "$KERNEL_DIR"
              for p in "${SUSFS_PATCHES[@]}"; do
                echo "  Apply: $(basename "$p")"
                if git apply --check "$p" 2>/dev/null; then
                  git apply "$p" && echo "    OK"
                else
                  git apply --3way "$p" 2>/dev/null && echo "    3-way OK" || \
                    echo "    skip"
                fi
              done
            )
          fi

          # 3. 复制 SUSFS 源码(fs/susfs/ 等)
          for src_dir in kernel_patches/fs kernel_patches/include kernel_patches/fs/susfs; do
            src="$WORK_DIR/susfs/$src_dir"
            if [[ -d "$src" ]]; then
              cp -rv "$src" "$KERNEL_DIR/" 2>/dev/null || true
            fi
          done
          # fallback: 找任何含 susfs 字样的目录
          mapfile -t SRC_DIRS < <(find "$WORK_DIR/susfs" -type d -name "*susfs*" 2>/dev/null)
          for d in "${SRC_DIRS[@]}"; do
            if [[ "$d" == *"/kernel"* ]]; then
              cp -rv "$d"/* "$KERNEL_DIR/" 2>/dev/null || true
              echo "复制: $d"
            fi
          done

          echo "susfs-head=$SUSFS_HEAD" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 设置 ccache 缓存(预热)
      # ============================================================
      - name: 设置 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coral-${{ github.run_id }}
          restore-keys: |
            ccache-coral-

      - name: 配置 ccache
        run: |
          ccache -M "$CCACHE_MAXSIZE"
          ccache -s
          ccache -z

      # ============================================================
      # 清理 out 输出目录
      # ============================================================
      - name: 清理 out 输出目录
        run: |
          rm -rf "$KERNEL_DIR/out"
          echo "out 已清理"
          ls "$KERNEL_DIR" | head

      # ============================================================
      # 以原厂 stock .config 为基底
      # ============================================================
      - name: 以原厂 stock .config 为基底
        id: stockconfig
        env:
          FACTORY_URL: ${{ inputs.stock_factory || secrets.CORAL_FACTORY_URL || 'https://dl.google.com/dl/android/aosp/coral-sp2a.220505.008-factory-b1d35049.zip' }}
        run: |
          cd "$WORK_DIR"

          # 1. 下载工厂镜像
          if [[ ! -f factory.zip ]]; then
            echo "下载工厂镜像: $FACTORY_URL"
            curl -fLO --retry 3 --retry-delay 5 "$FACTORY_URL"
          fi
          mkdir -p factory_extracted
          unzip -q -o factory.zip -d factory_extracted 2>/dev/null || true
          ls -lh factory.zip
          ls factory_extracted/

          # 2. 找 stock boot.img
          BOOT_IMG=$(find factory_extracted -name boot.img | head -n 1)
          if [[ -z "$BOOT_IMG" ]]; then
            echo "ERROR: factory 镜像里找不到 boot.img"
            exit 1
          fi
          echo "stock boot.img: $BOOT_IMG"
          cp "$BOOT_IMG" "$WORK_DIR/stock-boot.img"

          # 3. 解包 stock boot.img(用 mkbootimg 工具)
          mkdir -p "$WORK_DIR/stock_boot"
          cd "$WORK_DIR/stock_boot"
          wget -q https://raw.githubusercontent.com/osm0sis/AnyKernel3/master/tools/mkbootimg
          wget -q https://raw.githubusercontent.com/osm0sis/AnyKernel3/master/tools/unpackbootimg
          chmod +x mkbootimg unpackbootimg

          ./unpackbootimg -i "$WORK_DIR/stock-boot.img" -o .
          ls

          # 4. 提取 stock 内核的 .config(通过 extract-ikconfig 脚本)
          if [[ -f boot.img-zImage ]]; then
            (
              cd "$KERNEL_DIR"
              if [[ -x scripts/extract-ikconfig ]]; then
                scripts/extract-ikconfig "$WORK_DIR/stock_boot/boot.img-zImage" > stock_ikconfig.txt
                echo "stock .config 提取成功: $(wc -l < stock_ikconfig.txt) 行"
                head -5 stock_ikconfig.txt
              else
                echo "WARNING: scripts/extract-ikconfig 不存在"
              fi
            )
          fi

          echo "stockboot-img=$WORK_DIR/stock-boot.img" >> "$GITHUB_OUTPUT"
          echo "stockboot-dir=$WORK_DIR/stock_boot" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 开启 BakaSU + SUSFS 配置
      # ============================================================
      - name: 开启 BakaSU + SUSFS 配置
        env:
          PATH: ${{ env.CLANG_DIR }}/bin:/usr/bin:/bin
        run: |
          cd "$KERNEL_DIR"

          # 1. 以 stock config 为基底
          if [[ -s stock_ikconfig.txt ]]; then
            cp stock_ikconfig.txt .config
            echo "使用 stock .config"
          else
            echo "stock .config 不可用,用 floral_defconfig"
            echo "(Pixel 4 / 4 XL 共用 'floral' defconfig — 见 build_coral.sh)"
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- floral_defconfig
          fi

          # 2. 开启 BakaSU(KernelSU)配置
          ./scripts/config --file .config --enable KSU || echo "  CONFIG_KSU 跳过"
          ./scripts/config --file .config --enable KSU_DEBUG || true

          # 3. 开启 SUSFS 配置(具体 Kconfig 名以实际为准)
          for opt in SUSFS SUSFS_SUS_MAP SUSFS_SUS_SU \
                     SUSFS_SUS_OVERLAYFS SUSFS_HIDE_BOOTPROGS \
                     SUSFS_HIDE_PROPS SUSFS_HIDE_APKS; do
            ./scripts/config --file .config --enable "$opt" 2>/dev/null || true
          done

          # 4. 让 Kconfig 重新解析
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "==== BakaSU + SUSFS 配置 ===="
          grep -E "CONFIG_KSU|CONFIG_SUSFS" .config | head -40 || true

          if ! grep -q "CONFIG_KSU=y" .config; then
            echo "WARNING: CONFIG_KSU 未开启,KernelSU 可能没集成"
          fi

      # ============================================================
      # 编译 Image.gz-dtb
      # ============================================================
      - name: 编译 Image.gz-dtb (clang ${{ env.CLANG_VERSION }} + GNU binutils, 内置 BakaSU + SUSFS)
        env:
          PATH: ${{ env.CLANG_DIR }}/bin:/usr/bin:/bin
          CC: clang
          CXX: clang++
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          BUILD_CONFIG: build.config
        run: |
          cd "$KERNEL_DIR"

          echo "==== 工具链版本 ===="
          clang --version
          aarch64-linux-gnu-gcc --version | head -n 1
          ld --version | head -n 1

          echo "==== ccache(编译前)===="
          ccache -s

          echo "==== 开始编译 ===="
          ./build/build.sh 2>&1 | tee "$WORK_DIR/build.log"

          echo "==== 产物 ===="
          ls -lh out/arch/arm64/boot/
          echo ""
          echo "==== ccache(编译后)===="
          ccache -s

      # ============================================================
      # 打包 new-boot.img(保留原版 v2 DTB 区)
      # ============================================================
      - name: 打包 new-boot.img (保留原版 v2 DTB 区)
        run: |
          cd "$WORK_DIR/stock_boot"

          NEW_KERNEL="$KERNEL_DIR/out/arch/arm64/boot/Image.gz-dtb"
          if [[ ! -f "$NEW_KERNEL" ]]; then
            echo "ERROR: new kernel Image.gz-dtb 不存在"
            ls "$KERNEL_DIR/out/arch/arm64/boot/" || true
            exit 1
          fi

          # 读取 stock boot.img 的元信息
          BASE=$(cat boot.img-base 2>/dev/null | tr -d '\n')
          PAGESIZE=$(cat boot.img-pagesize 2>/dev/null | tr -d '\n')
          CMDLINE=$(cat boot.img-cmdline 2>/dev/null | tr -d '\n')
          KERNEL_OFFSET=$(cat boot.img-kernel_offset 2>/dev/null | tr -d '\n')
          RAMDISK_OFFSET=$(cat boot.img-ramdisk_offset 2>/dev/null | tr -d '\n')
          TAGS_OFFSET=$(cat boot.img-tags_offset 2>/dev/null | tr -d '\n')
          SECOND_OFFSET=$(cat boot.img-second_offset 2>/dev/null | tr -d '\n')

          echo "stock 元信息:"
          echo "  base=$BASE"
          echo "  pagesize=$PAGESIZE"
          echo "  cmdline=$CMDLINE"
          echo "  kernel_offset=$KERNEL_OFFSET"

          # 保留原版 v2 DTB 区(关键:custom 内核可能没正确生成 DTB)
          DTB_ARG=""
          if [[ -f boot.img-dtb ]]; then
            DTB_ARG="--dtb boot.img-dtb"
            echo "使用 stock v2 DTB: $(ls -lh boot.img-dtb)"
          else
            echo "WARN: stock boot.img-dtb 不存在,使用 new kernel 自带 DTB"
          fi

          # 打包
          ./mkbootimg \
            --kernel "$NEW_KERNEL" \
            --ramdisk ramdisk.cpio.gz \
            --cmdline "$CMDLINE" \
            --base "$BASE" \
            --pagesize "$PAGESIZE" \
            --kernel_offset "$KERNEL_OFFSET" \
            --ramdisk_offset "$RAMDISK_OFFSET" \
            --tags_offset "$TAGS_OFFSET" \
            --second_offset "$SECOND_OFFSET" \
            $DTB_ARG \
            --output "$OUT_DIR/new-boot.img"

          ls -lh "$OUT_DIR/new-boot.img"

          # 校验
          ./unpackbootimg -i "$OUT_DIR/new-boot.img" -o $WORK_DIR/new_boot_unpacked 2>&1 | head
          ls $WORK_DIR/new_boot_unpacked/

      # ============================================================
      # 制作 AnyKernel3 卡刷包
      # ============================================================
      - name: 制作 AnyKernel3 卡刷包
        env:
          AK3_REPO: ${{ inputs.anykernel3_repo || secrets.ANYKERNEL3_REPO || '' }}
        run: |
          AK3_DIR="$WORK_DIR/AnyKernel3"

          # 1. clone AnyKernel3 模板
          if [[ -n "$AK3_REPO" ]]; then
            echo "使用自定义 AnyKernel3: $AK3_REPO"
            git clone --depth=1 "$AK3_REPO" "$AK3_DIR"
          else
            echo "使用默认 AnyKernel3 模板(osm0sis/AnyKernel3)"
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK3_DIR"
          fi

          # 2. 复制新内核
          cp "$KERNEL_DIR/out/arch/arm64/boot/Image.gz-dtb" "$AK3_DIR/zImage"

          # 3. 复制 ramdisk(用 stock 的,通常 custom 内核不重新打包 ramdisk)
          if [[ -f "$WORK_DIR/stock_boot/ramdisk.cpio.gz" ]]; then
            cp "$WORK_DIR/stock_boot/ramdisk.cpio.gz" "$AK3_DIR/ramdisk.cpio.gz" 2>/dev/null || true
          fi

          # 4. 复制 dtb(保留原厂 v2 DTB)
          if [[ -f "$WORK_DIR/stock_boot/boot.img-dtb" ]]; then
            cp "$WORK_DIR/stock_boot/boot.img-dtb" "$AK3_DIR/dtb" 2>/dev/null || true
          fi

          # 5. 清理 .git
          rm -rf "$AK3_DIR/.git"

          # 6. 打包 zip
          cd "$AK3_DIR"
          ZIP_NAME="AnyKernel3-coral-$(date +%Y%m%d-%H%M%S).zip"
          zip -r "$OUT_DIR/$ZIP_NAME" . -x "*.git*"

          echo "==== 产物 ===="
          ls -lh "$OUT_DIR/"

      # ============================================================
      # 上传产物
      # ============================================================
      - name: 上传 new-boot.img
        uses: actions/upload-artifact@v4
        with:
          name: new-boot-${{ github.sha }}
          path: ${{ env.OUT_DIR }}/new-boot.img
          retention-days: 14
          if-no-files-found: error

      - name: 上传 AnyKernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-${{ github.sha }}
          path: ${{ env.OUT_DIR }}/AnyKernel3-coral-*.zip
          retention-days: 14
          if-no-files-found: warn

      - name: 上传 ccache 统计 + build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ github.sha }}
          path: |
            ${{ env.WORK_DIR }}/build.log
          retention-days: 7
          if-no-files-found: warn

      # ============================================================
      # Post
      # ============================================================
      - name: Post 设置 ccache 缓存
        if: always()
        run: |
          echo "==== ccache 统计 ===="
          ccache -s
          echo ""
          echo "ccache 大小:"
          du -sh "$CCACHE_DIR" 2>/dev/null || echo "(空)"

      - name: Post 检出 fork 仓库源码(状态汇总)
        if: always()
        run: |
          echo "==== GitHub Actions 工作目录 ===="
          ls -la "$GITHUB_WORKSPACE"
          echo ""
          echo "==== 工作目录 ===="
          ls -la "$WORK_DIR"
          echo ""
          echo "==== 产物 ===="
          ls -la "$OUT_DIR"
          echo ""
          echo "==== build.log 最后 50 行 ===="
          tail -n 50 "$WORK_DIR/build.log" 2>/dev/null || echo "(无 build.log)"

      # ============================================================
      # tag 触发时创建 GitHub Release
      # ============================================================
      - name: 创建 GitHub Release (仅 tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KSU_HEAD: ${{ steps.bakasu.outputs.kernelsu-head }}
          SUSFS_HEAD: ${{ steps.susfs.outputs.susfs-head }}
          CORAL_HEAD: ${{ steps.bakasu.outputs.coral-head }}
        run: |
          printf '%s\n' \
            '## Pixel 4XL (coral) 内核构建' \
            '' \
            "- **Tag**: \`${{ github.ref_name }}\`" \
            "- **Commit**: \`${{ github.sha }}\`" \
            "- **触发**: ${{ github.event_name }} by @${{ github.actor }}" \
            '' \
            '### 组件版本' \
            "- **coral kernel**: \`${CORAL_HEAD}\`" \
            "- **KernelSU/BakaSU**: \`${KSU_HEAD}\`" \
            "- **SUSFS**: \`${SUSFS_HEAD}\`" \
            "- **Linux kernel**: $(cat $KERNEL_DIR/include/config/kernel.release 2>/dev/null || echo N/A)" \
            '' \
            '### 产物' \
            '- `new-boot.img` — boot 镜像,保留原厂 v2 DTB' \
            '- `AnyKernel3-coral-*.zip` — TWRP 卡刷包' \
            '' \
            '### 刷机方法' \
            '1. TWRP recovery → Install → 选 zip' \
            '2. 或 fastboot: `fastboot flash boot new-boot.img`' \
            > "$WORK_DIR/release_notes.md"

          cat "$WORK_DIR/release_notes.md"

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Pixel 4XL Kernel ${{ github.ref_name }}"
          body_path: ${{ env.WORK_DIR }}/release_notes.md
          files: |
            ${{ env.OUT_DIR }}/new-boot.img
            ${{ env.OUT_DIR }}/AnyKernel3-coral-*.zip
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
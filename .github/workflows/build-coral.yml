# GitHub Actions: Build Pixel 4XL (coral) Android 13 内核
# 含 BakaSU (KernelSU fork) + SUSFS (simonpunk/susfs4ksu kernel-4.14, v1.5.5) + AnyKernel3 卡刷包打包
#
# 触发:
#   - pull_request:  构建 + 上传 artifact
#   - push main:     构建 + 上传 artifact
#   - tag v*.*.*:    构建 + 上传 + 自动创建 GitHub Release
#   - workflow_dispatch: 手动,可选输入仓库 URL
#
# 输出:
#   - new-boot.img                        boot 镜像(保留原厂 v2 DTB)
#   - AnyKernel3-coral-<timestamp>.zip    TWRP 卡刷包
#
# 关键设计:
#   - 单 job(Sequential),因为所有步骤都在同一个 runner 上跑效率最高
#   - clang 11.0.1 直接从 LLVM 官方 GitHub release 下载
#   - ccache 用 actions/cache@v4 跨 run 复用
#   - 错误步骤 continue-on-error + 总结日志输出,避免 job 一报错什么都看不到

name: Build coral kernel (GKI + BakaSU + SUSFS)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-coral.yml'
      - 'kernel/**'
      - 'patches/**'
      - 'scripts/**'
      - 'anykernel3/**'
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'coral 内核分支(msnx/KernelSU-Pixel4XL 只提供 main)'
        default: 'main'
        type: choice
        options:
          - main
      kernel_repo:
        description: 'coral 内核仓库 URL(默认 msnx/KernelSU-Pixel4XL,已预集成 KSU)'
        default: 'https://github.com/msnx/KernelSU-Pixel4XL'
        type: string
      kernelsu_repo:
        description: 'KernelSU (BakaSU) 仓库 — 默认 backslashxx/KernelSU(覆盖 3.0~7.2,LKM/单源)'
        default: 'https://github.com/backslashxx/KernelSU'
        type: string
      kernelsu_branch:
        description: 'KernelSU 分支 — backslashxx 用 master(不是 main!)'
        default: 'master'
        type: string
      kernelsu_release_tag:
        description: 'ksud prebuilt 下载哪个 release tag(留空用最新)'
        default: ''
        type: string
      susfs_repo:
        description: 'SUSFS 仓库(默认 simonpunk/susfs4ksu on GitLab,kernel-4.14 分支)'
        default: 'https://gitlab.com/simonpunk/susfs4ksu.git'
        type: string
      susfs_branch:
        description: 'SUSFS 分支(Pixel 4 XL 用 kernel-4.14,v1.5.5)'
        default: 'kernel-4.14'
        type: string
      anykernel3_repo:
        description: 'AnyKernel3 模板仓库(留空用 osm0sis/AnyKernel3)'
        default: ''
        type: string
      stock_factory:
        description: 'Pixel 4XL 工厂镜像 URL'
        default: 'https://dl.google.com/dl/android/aosp/coral-tp1a.220624.014-factory-8f60813e.zip'
        type: string

# 写权限仅给 release(后续 tag release 会用)
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 路径
  WORK_DIR: ${{ github.workspace }}/work
  KERNEL_DIR: ${{ github.workspace }}/work/kernel/google-coral
  OUT_DIR: ${{ github.workspace }}/output
  CLANG_DIR: ${{ github.workspace }}/work/clang
  CCACHE_DIR: ${{ github.workspace }}/.ccache

  # 工具链版本
  CLANG_VERSION: '11.0.1'
  # SUSFS 版本只用作日志/显示;susfs4ksu upstream 是按 kernel 树分分支的,
  # 真正的"版本"在 $KERNEL_DIR/fs/susfs.c 的 pr_info 里,不是 tag/branch 名。

  # 工厂镜像(在多个 step 共享:stockconfig 下载、cache key)
  FACTORY_URL: ${{ inputs.stock_factory || secrets.CORAL_FACTORY_URL || 'https://dl.google.com/dl/android/aosp/coral-tp1a.220624.014-factory-8f60813e.zip' }}

  # 磁盘预检:factory 2.2GB + 解压 ~4GB + ccache 30GB ≈ 36GB,留 6GB 缓冲
  MIN_FREE_GB: '6'
  # Pixel 4 XL (kernel 4.14) 用 simonpunk/susfs4ksu 的 `kernel-4.14` 分支,
  # 对应 SUSFS v1.5.5(v2.x 是 GKI 5.10+ 的,4.14 用不了)。
  SUSFS_VERSION: '1.5.5'

  # ccache
  CCACHE_MAXSIZE: '30G'

jobs:
  build:
    name: Build kernel with BakaSU + SUSFS
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      # ============================================================
      # Set up job — 检出源码 + 构建编译环境
      # ============================================================
      - name: 检出 fork 仓库源码
        uses: actions/checkout@v4
        with:
          path: ${{ github.workspace }}
          fetch-depth: 1

      - name: 构建编译内核环境 & 创建工作目录
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget xz-utils unzip zip cpio rsync \
            bc bison build-essential ccache flex \
            libssl-dev libelf-dev dwarves \
            xxd python3 python2 \
            libtinfo5 zlib1g-dev binutils-aarch64-linux-gnu \
            device-tree-compiler
          # 大文件稀疏 checkout 优化
          git config --global core.sparseCheckout true
          git config --global advice.detachedHead false

          mkdir -p $WORK_DIR $OUT_DIR $CCACHE_DIR
          echo "WORK_DIR=$WORK_DIR"
          echo "KERNEL_DIR=$KERNEL_DIR"
          echo "OUT_DIR=$OUT_DIR"
          df -h $WORK_DIR

      # ============================================================
      # 磁盘预检 — factory 2.2GB + 解压 ~4GB + 编译产物 + ccache
      # ============================================================
      - name: 磁盘空间预检
        run: |
          FREE_KB=$(df --output=avail "$WORK_DIR" | tail -1 | tr -d ' ')
          FREE_GB=$((FREE_KB / 1024 / 1024))
          echo "WORK_DIR 剩余空间: ${FREE_GB}GB"
          NEED="$MIN_FREE_GB"
          if [[ "$FREE_GB" -lt "$NEED" ]]; then
            echo "::error::磁盘空间不足,需要至少 ${NEED}GB,实际剩余 ${FREE_GB}GB"
            echo "已用空间明细:"
            du -sh "$WORK_DIR" "$CCACHE_DIR" "$OUT_DIR" 2>/dev/null | sort -h || true
            echo "提示:可在 ccache 限速 (CCACHE_MAXSIZE) 或加 -Xmx 给 gradle 上限"
            exit 1
          fi
          echo "磁盘预检通过:剩余 ${FREE_GB}GB >= ${NEED}GB"

      # ============================================================
      # 下载 clang 11.0.1 (LLVM 官方 release)
      # ============================================================
      - name: 下载 clang ${{ env.CLANG_VERSION }} 工具链 (LLVM 官方 release)
        run: |
          mkdir -p $CLANG_DIR
          cd "$(dirname "$CLANG_DIR")"

          CLANG_TARBALL="clang+llvm-${CLANG_VERSION}-x86_64-linux-gnu-ubuntu-16.04.tar.xz"
          CLANG_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${CLANG_VERSION}/${CLANG_TARBALL}"

          echo "下载: $CLANG_URL"
          wget --progress=dot:giga "$CLANG_URL" 2>&1 | tail -n 3
          ls -lh "$CLANG_TARBALL"

          echo "解压到 $CLANG_DIR ..."
          tar -xJf "$CLANG_TARBALL" -C "$CLANG_DIR" --strip-components=1
          rm "$CLANG_TARBALL"

          # 验证
          $CLANG_DIR/bin/clang --version
          $CLANG_DIR/bin/ld.lld --version 2>&1 | head -n 1 || true

      # ============================================================
      # 集成 BakaSU (KernelSU 分支,内置 su)
      # ============================================================
      - name: 集成 BakaSU (KernelSU 分支)
        id: bakasu
        # 30 分钟对两个大仓库的 clone 来说宽裕;超时就停,避免挂死
        timeout-minutes: 30
        env:
          KSU_REPO: ${{ inputs.kernelsu_repo || secrets.BAKASU_REPO || 'https://github.com/tiann/KernelSU' }}
          KSU_BRANCH: ${{ inputs.kernelsu_branch || secrets.BAKASU_BRANCH || 'main' }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch || 'main' }}
          # coral 内核在 community 仓库 msnx/KernelSU-Pixel4XL (Pixel 4 / 4 XL 共用 "floral" 内核)。
          # 上游 AOSP `android.googlesource.com/kernel/google/coral/` 不存在(404);
          # 官方遗留分支是 `device/google/coral-kernel` 而非 kernel 树,无法直接 git clone。
          KERNEL_REPO: ${{ inputs.kernel_repo || secrets.CORAL_KERNEL_REPO || 'https://github.com/msnx/KernelSU-Pixel4XL' }}
          # 网络调优:挂死检测 + 不稳定连接退避
          GIT_HTTP_LOW_SPEED_LIMIT: '1000'  # 1KB/s 持续 N 秒算挂
          GIT_HTTP_LOW_SPEED_TIME: '60'
          GIT_RETRY_COUNT: '3'
        run: |
          set -euo pipefail
          cd "$WORK_DIR"

          # 幂等 clone:已存在且 HEAD 匹配就跳过,避免被取消后重跑全量重下
          smart_clone() {
            local url="$1" branch="$2" dest="$3"
            if [[ -d "$dest/.git" ]]; then
              # 检查现有 HEAD 是否匹配期望的 branch
              if git -C "$dest" rev-parse --verify "origin/$branch" >/dev/null 2>&1; then
                local cur
                cur=$(git -C "$dest" rev-parse --short "origin/$branch" 2>/dev/null || echo "")
                if [[ -n "$cur" ]]; then
                  echo "复用已有 $dest (HEAD=$cur @ $branch)"
                  git -C "$dest" checkout -q "$branch" 2>/dev/null || true
                  echo "$cur"
                  return 0
                fi
              fi
              echo "$dest 存在但 HEAD 不匹配,删除重 clone"
              rm -rf "$dest"
            fi
            # --depth=1 + --single-branch 减体积;失败 3 次重连
            local attempt=0
            while [[ $attempt -lt $GIT_RETRY_COUNT ]]; do
              attempt=$((attempt + 1))
              echo "Clone [$attempt/$GIT_RETRY_COUNT]: $url @ $branch -> $dest"
              if git clone --depth=1 --single-branch --branch "$branch" \
                   --config http.lowSpeedLimit=$GIT_HTTP_LOW_SPEED_LIMIT \
                   --config http.lowSpeedTime=$GIT_HTTP_LOW_SPEED_TIME \
                   -- "$url" "$dest"; then
                git -C "$dest" rev-parse --short HEAD
                return 0
              fi
              echo "  clone 失败,${attempt} 秒后重试"
              sleep $((attempt * 5))
            done
            echo "::error::Clone 失败($GIT_RETRY_COUNT 次): $url @ $branch"
            return 1
          }

          # 1. 拉取 KernelSU/BakaSU 源码
          KSU_HEAD=$(smart_clone "$KSU_REPO" "$KSU_BRANCH" KernelSU)
          echo "KernelSU HEAD: $KSU_HEAD"

          # 2. 拉取 coral 内核源码
          CORAL_HEAD=$(smart_clone "$KERNEL_REPO" "$KERNEL_BRANCH" "$KERNEL_DIR")
          echo "coral HEAD: $CORAL_HEAD"

          # 3. 备份并选择 build.config
          #
          # Pixel 4 XL 4.14 仓库存放方式有两种:
          #   A. 标准 AOSP(common kernel):build/build.config.* 在 build/ 子目录
          #   B. PixelExperience/msnx 等 fork:build.config.* 在仓库根目录,且配 build_floral.sh
          #      wrapper — 这种必须用 wrapper(里面设 BUILD_CONFIG=private/msm-google/...)
          #      wrapper 是 Google 内部 build 期望的入口
          cd "$KERNEL_DIR"
          # 备份(若有)— 在两处都查
          for cfg in build.config.coral build.config.floral build.config.gki \
                     build.config.aarch64 build.config.common; do
            [[ -f "build/$cfg" ]] && cp "build/$cfg" "build/$cfg.bak" 2>/dev/null || true
            [[ -f "$cfg" ]]      && cp "$cfg"      "$cfg.bak"      2>/dev/null || true
          done

          # 探测函数:在指定目录里找带特定后缀的 build.config
          find_bc() {
            # $1 = dir, $2 = suffix (coral|floral|sunfish|gki|aarch64)
            local dir="$1" suffix="$2"
            local candidates=(
              "$dir/build.config.$suffix"
              "$dir/build.config.${suffix}_no-cfi"
              "$dir/build.config.${suffix}_performance"
              "$dir/build.config"
            )
            for c in "${candidates[@]}"; do
              [[ -f "$c" ]] && { echo "$c"; return 0; }
            done
            return 1
          }

          # 探测默认 defconfig(floral/sunfish 等)— 后面 KSU 集成和 config 步骤要用
          DEFCONFIG_NAME=""
          for guess in floral_defconfig coral_defconfig sunfish_defconfig; do
            if grep -q "^CONFIG_BOARD_${guess%%_*}" .config 2>/dev/null || \
               [[ -f "arch/arm64/configs/${guess}" ]]; then
              DEFCONFIG_NAME="$guess"
              break
            fi
          done
          DEFCONFIG_NAME="${DEFCONFIG_NAME:-floral_defconfig}"
          echo "→ DEFCONFIG 探测结果: $DEFCONFIG_NAME"

          # 选 build.config
          # 优先级:
          #   1. wrapper 脚本(build_floral.sh / build_sunfish.sh)— msnx / PixelExperience 仓专用
          #   2. build/ 下的 build.config.{coral,floral,sunfish,gki}(标准 AOSP 布局)
          #   3. 根目录下的 build.config.{coral,floral,sunfish}(fork 布局)
          #   4. 兜底:用 ${DEFCONFIG_NAME%_defconfig} 拼一个 minimal build.config
          BUILD_CONFIG_REL=""
          USE_WRAPPER=""
          for sfx in floral sunfish coral gki aarch64; do
            for wrapper_name in build_${sfx}.sh; do
              if [[ -x "./$wrapper_name" ]] || [[ -f "./$wrapper_name" ]]; then
                USE_WRAPPER="./$wrapper_name"
                # wrapper 内部用的是相对路径 BUILD_CONFIG=private/msm-google/...
                # 我们记录下,后续直接 export BUILD_CONFIG
                BUILD_CONFIG_REL="private/msm-google/build.config.${sfx}_no-cfi"
                echo "→ 找到 wrapper: $wrapper_name(将用它调用 build.sh)"
                break 2
              fi
            done
          done

          if [[ -z "$USE_WRAPPER" ]]; then
            # 没 wrapper,直接找 build.config
            if [[ -f build/build.config.gki ]]; then
              BUILD_CONFIG_REL="build/build.config.gki"
            elif BC=$(find_bc build floral) && [[ -n "$BC" ]]; then
              BUILD_CONFIG_REL="$BC"
            elif BC=$(find_bc . floral) && [[ -n "$BC" ]]; then
              BUILD_CONFIG_REL="$BC"
            elif BC=$(find_bc . coral) && [[ -n "$BC" ]]; then
              BUILD_CONFIG_REL="$BC"
            elif BC=$(find_bc . sunfish) && [[ -n "$BC" ]]; then
              BUILD_CONFIG_REL="$BC"
            elif [[ -f build.config ]]; then
              BUILD_CONFIG_REL="build.config"
            fi
          fi

          if [[ -z "$BUILD_CONFIG_REL" ]]; then
            # 兜底:写一个 minimal build.config(用 floral_defconfig)
            # — 仅在没有 build.sh / build/build.sh 时才走,否则 build.sh 会因为缺私有 module 挂
            # 引号 heredoc 防 ${} 被 YAML 解析(虽然 run: | 应该没问题,但双保险)
            cat > build.config <<'EOF_MINIMAL'
            DEFCONFIG=__DEFCONFIG__
            EOF_MINIMAL
            sed -i "s|__DEFCONFIG__|${DEFCONFIG_NAME}|" build.config
            echo "::warning::没找到 build.config.* 也没 wrapper,写了一个 minimal:DEFCONFIG=${DEFCONFIG_NAME}"
            echo "  这通常意味着 kernel_repo 不完整(缺少 private/msm-google 私有模块)"
            echo "  建议改用完整 AOSP manifest:kernel_repo 保持默认,改用 repo 工具初始化"
            cat build.config
          else
            # 兼容老代码的 build.config 软链(部分旧 patch 会检查这个)
            if [[ ! -e build.config ]] && [[ ! -L build.config ]]; then
              ln -sf "$BUILD_CONFIG_REL" build.config
              echo "→ build.config -> $BUILD_CONFIG_REL(软链,兼容)"
            fi
            echo "→ BUILD_CONFIG=$BUILD_CONFIG_REL"
            if [[ -n "$USE_WRAPPER" ]]; then
              echo "→ 调用方式:$USE_WRAPPER(里面会设 BUILD_CONFIG 并调 build/build.sh)"
            fi
            echo "---- 当前 build.config 内容 ----"
            cat "$BUILD_CONFIG_REL" 2>/dev/null | head -20 || true
          fi

          # ===== 处理 private/msm-google 缺失 =====
          # 现实:PixelExperience / msnx 这类 fork 的 build.config 都引用
          # ${KERNEL_DIR}/build.config.xxx(默认 KERNEL_DIR=private/msm-google),
          # 而该目录在公开 fork 中根本不存在 — 没有 Google 私有模块。
          # 解决:临时建一个 private/msm-google/ 空壳,把所有 build.config.* 软链
          # 过去,让 build.sh 跑得通(虽然 wlan.ko 等私有 .ko 不会生成,但能
          # 编出 Image.lz4-dtb;boot 可能因缺 wifi 驱动而部分功能受限)
          if [[ -d "$KERNEL_DIR/private/msm-google" ]]; then
            echo "→ private/msm-google/ 存在(完整 AOSP 布局,直接编译)"
          else
            echo "::warning::private/msm-google/ 不存在 — 这是公开 fork 的常见情况"
            mkdir -p "$KERNEL_DIR/private/msm-google"
            # 把根目录的 build.config.* 软链到 private/msm-google/
            # 这样 BUILD_CONFIG=private/msm-google/build.config.floral_no-cfi 能找到
            shopt -s nullglob
            for cfg in "$KERNEL_DIR"/build.config.*; do
              [[ -f "$cfg" ]] || continue
              bn=$(basename "$cfg")
              [[ ! -e "$KERNEL_DIR/private/msm-google/$bn" ]] && \
                ln -sf "../../$bn" "$KERNEL_DIR/private/msm-google/$bn"
            done
            shopt -u nullglob
            # 私有 vendor 目录也建空壳(部分 build.config 会 source 它们)
            for subdir in techpack/audio techpack/camera techpack/dataipa \
                          techpack/display techpack/video \
                          vendor/qcom/opensource/audio-kernel \
                          vendor/qcom/opensource/camera-kernel \
                          vendor/qcom/opensource/dataipa; do
              mkdir -p "$KERNEL_DIR/$subdir"
            done
            echo "  已建 private/msm-google/ 壳 + 软链所有 build.config.*"
            echo "  注意:私有 vendor .ko(wlan.ko 等)不会编出,boot 可能跑不全 wifi/相机等"
            echo "  完整方案:用 AOSP 'repo' 工具初始化或换含私有模块的 fork"
          fi

          # 导出给后续编译步骤用
          echo "BUILD_CONFIG_PATH=$BUILD_CONFIG_REL"   >> "$GITHUB_ENV"
          echo "BUILD_WRAPPER=$USE_WRAPPER"             >> "$GITHUB_ENV"
          echo "DEFCONFIG_NAME=$DEFCONFIG_NAME"         >> "$GITHUB_ENV"

          # 4. 集成 KernelSU/BakaSU(真正的 in-tree 集成)
          #
          #    标准流程:
          #      a) 读内核版本,选 kernel_patches/${KRN_MAJOR}/ 子目录
          #      b) git apply *.patch 到内核树
          #      c) 复制 KernelSU/kernel/ 源码到 patch 期望的位置(通常 drivers/kernelsu/)
          #      d) 接入 drivers/Kconfig 和 drivers/Makefile
          #
          #    兼容:
          #      - msnx/KernelSU-Pixel4XL(默认): 4.14 特定 patch 已应用、drivers/kernelsu 存在
          #        → 检测到已集成,跳过写入,只做验证
          #      - vanilla 4.14 coral 内核: 完整执行 a)~d)
          #      - 不支持的版本: 报错退出
          echo "===== 集成 KernelSU/BakaSU ====="
          # 多指标检测已集成:
          #   - 标准:drivers/kernelsu/ + Makefile 含 kernelsu
          #   - fork 自定义:drivers/ 下任何 ksu_*.c / KernelSU_*.c
          #   - fork 通过 patch 系列:kernel_patches/ 已就位(说明仓库自带集成脚本)
          #   - msnx/KernelSU-Pixel4XL 风格:Kconfig 里有 CONFIG_KSU,或 include/ 改了 detect
          pre_integrated=false
          if [[ -d "$KERNEL_DIR/drivers/kernelsu" ]] && \
             grep -q "kernelsu" "$KERNEL_DIR/drivers/Makefile" 2>/dev/null; then
            pre_integrated=true
            echo "  检测:drivers/kernelsu + Makefile.kernelsu ✓"
          fi
          if ! $pre_integrated && \
             find "$KERNEL_DIR" -maxdepth 4 -type f \( -name "ksu_*.c" -o -name "KernelSU_*.c" \) 2>/dev/null | grep -q .; then
            pre_integrated=true
            echo "  检测:drivers/ 下有 ksu_*.c / KernelSU_*.c ✓"
          fi
          if ! $pre_integrated && \
             grep -rq "CONFIG_KSU\b" "$KERNEL_DIR/Kconfig*" "$KERNEL_DIR/drivers/Kconfig" 2>/dev/null; then
            pre_integrated=true
            echo "  检测:Kconfig 已含 CONFIG_KSU ✓"
          fi
          if $pre_integrated; then
            echo "✓ 内核已预集成 KernelSU,跳过写入,只做最终验证"
          else
            echo "→ 内核未集成 KernelSU,执行 in-tree 集成"
            cd "$KERNEL_DIR"

            # 4.1 读内核版本
            KRN_VER=$(grep -E '^VERSION\s*=' Makefile | head -1 | tr -d ' ' | cut -d= -f2)
            KRN_PATCHLEVEL=$(grep -E '^PATCHLEVEL\s*=' Makefile | head -1 | tr -d ' ' | cut -d= -f2)
            KRN_SUB=$(grep -E '^SUBLEVEL\s*=' Makefile | head -1 | tr -d ' ' | cut -d= -f2)
            KRN_MAJOR="${KRN_VER}.${KRN_PATCHLEVEL}"
            echo "  内核版本: ${KRN_VER}.${KRN_PATCHLEVEL}.${KRN_SUB} (major: ${KRN_MAJOR})"

            # 4.2 选 patch 子目录(tiann/KernelSU 的 kernel_patches/ 按主版本分子目录)
            PATCH_BASE="$WORK_DIR/KernelSU/kernel_patches"
            PATCH_FILES=()
            if [[ -d "$PATCH_BASE/${KRN_MAJOR}" ]]; then
              mapfile -t PATCH_FILES < <(find "$PATCH_BASE/${KRN_MAJOR}" -maxdepth 1 -name "*.patch" | sort)
              echo "  找到 ${KRN_MAJOR} 特定 patch: ${#PATCH_FILES[@]} 个"
            elif [[ -d "$PATCH_BASE" ]]; then
              # 退到通用 patch(可能散在 common/、gki/ 等子目录里)
              mapfile -t PATCH_FILES < <(find "$PATCH_BASE" -maxdepth 2 -name "*.patch" 2>/dev/null | sort)
              echo "  找到通用 patch: ${#PATCH_FILES[@]} 个"
            fi

            if [[ ${#PATCH_FILES[@]} -eq 0 ]]; then
              # ===== 自动回退:4.14 内核用 tiann/KernelSU @ v0.5.2 =====
              # 历史:KernelSU v0.6.0 起只跟 GKI(5.10+),4.14 patches 被砍;
              # v0.5.2 是最后一个含 kernel_patches/4.14/ 的 release tag。
              # 几乎所有 modern fork(backslashxx/backslashxx 等)的 master/main
              # 都没有 4.14,所以直接 fallback 是最稳的方案。
              if [[ "$KRN_MAJOR" == "4.14" ]]; then
                echo "::warning::${KSU_REPO}@${KSU_BRANCH} 没 4.14 patch,自动回退到 tiann/KernelSU @ v0.5.2"
                cd "$WORK_DIR"
                rm -rf KernelSU
                FB_OK=false
                for fb_repo in \
                  "https://github.com/tiann/KernelSU|v0.5.2" \
                  "https://github.com/tiann/KernelSU|master"; do
                  FB_URL="${fb_repo%|*}"
                  FB_TAG="${fb_repo#*|}"
                  echo "  回退尝试: $FB_URL @ $FB_TAG"
                  attempt=0
                  while [[ $attempt -lt $GIT_RETRY_COUNT ]]; do
                    attempt=$((attempt + 1))
                    if git clone --depth=1 --branch "$FB_TAG" \
                         --config http.lowSpeedLimit=$GIT_HTTP_LOW_SPEED_LIMIT \
                         --config http.lowSpeedTime=$GIT_HTTP_LOW_SPEED_TIME \
                         -- "$FB_URL" KernelSU 2>/dev/null; then
                      FB_OK=true
                      break 2
                    fi
                    sleep $((attempt * 5))
                  done
                done
                if ! $FB_OK; then
                  echo "::error::自动回退到 tiann/KernelSU 也无法 clone(网络问题?)"
                  echo "  手动方案:kernelsu_repo=https://github.com/begmans/ksu-pixel4xl"
                  exit 1
                fi
                KSU_HEAD=$(git -C KernelSU rev-parse --short HEAD)
                echo "回退成功,新 HEAD: $KSU_HEAD"

                # 重新探测 4.14 patch
                PATCH_BASE="$WORK_DIR/KernelSU/kernel_patches"
                if [[ -d "$PATCH_BASE/4.14" ]]; then
                  mapfile -t PATCH_FILES < <(find "$PATCH_BASE/4.14" -maxdepth 1 -name "*.patch" | sort)
                  echo "  → 回退后找到 4.14 patch: ${#PATCH_FILES[@]} 个"
                fi
              fi
            fi

            if [[ ${#PATCH_FILES[@]} -eq 0 ]]; then
              echo "::error::KernelSU/kernel_patches/ 找不到 ${KRN_MAJOR} 对应的 patch"
              echo "  排查清单:"
              echo "    1. 你指定的 kernelsu_repo(默认 backslashxx/KernelSU)是否包含 ${KRN_MAJOR} 的 patch?"
              echo "       - tiann/KernelSU main:仅 5.10+ GKI"
              echo "       - backslashxx/KernelSU master:仅 5.10+"
              echo "       - tiann/KernelSU @ v0.5.2:含 4.14 patch(应自动回退,否则 4.14 走不通)"
              echo "    2. 内核树本身是否已经集成 KSU?(drivers/kernelsu 存在会跳过)"
              echo "    3. 内核版本不在主流支持范围(仅 4.14 / 4.19 / 5.4 / 5.10 / 5.15 / 6.1 测试过)"
              echo "  解法:"
              echo "    - kernelsu_repo=https://github.com/tiann/KernelSU, kernelsu_branch=v0.5.2(4.14)"
              echo "    - 或 kernelsu_repo=https://github.com/begmans/ksu-pixel4xl(已集成 4.14)"
              echo "    - 或 kernel_repo 改用 msnx/KernelSU-Pixel4XL(默认就是这个)"
              exit 1
            fi

            # 4.3 应用 patch
            #    fallback 可能让我们在 $WORK_DIR,这里强制回到 $KERNEL_DIR
            cd "$KERNEL_DIR"
            echo "应用 ${#PATCH_FILES[@]} 个 patch:"
            APPLIED=0
            FAILED=0
            for p in "${PATCH_FILES[@]}"; do
              rel="${p#$PATCH_BASE/}"
              if git apply --check "$p" 2>/dev/null; then
                if git apply "$p"; then
                  echo "  ✓ $rel"
                  APPLIED=$((APPLIED + 1))
                else
                  echo "  ✗ $rel (apply 失败)"
                  FAILED=$((FAILED + 1))
                fi
              elif git apply --3way "$p" 2>/dev/null; then
                echo "  ✓ $rel (3-way)"
                APPLIED=$((APPLIED + 1))
              else
                echo "  ⚠ $rel (冲突,跳过)"
                FAILED=$((FAILED + 1))
              fi
            done
            echo "  应用结果: $APPLIED 成功 / $FAILED 跳过"

            if [[ $APPLIED -eq 0 ]]; then
              echo "::error::没有成功应用任何 patch,集成失败"
              exit 1
            fi

            # 4.4 复制 kernel/ 源码到 drivers/kernelsu/
            #     patch 应该已创建该目录;如果没,手动创建
            mkdir -p drivers/kernelsu
            echo "复制 KernelSU/kernel/* → drivers/kernelsu/:"
            for f in "$WORK_DIR/KernelSU/kernel"/*; do
              bn=$(basename "$f")
              if [[ -f "drivers/kernelsu/$bn" ]]; then
                echo "  ⊘ $bn (已存在,跳过)"
              else
                if cp "$f" "drivers/kernelsu/$bn" 2>/dev/null; then
                  echo "  ✓ $bn"
                else
                  echo "  ✗ $bn"
                fi
              fi
            done

            # 4.5 接入 drivers/Kconfig(引用 kernelsu 子目录的 Kconfig)
            if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
              echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
              echo "  ✓ drivers/Kconfig: 追加 source 行"
            else
              echo "  ⊘ drivers/Kconfig: 已含 kernelsu"
            fi

            # 4.6 接入 drivers/Makefile
            #    obj-y(强制编进 vmlinux,不要 m)— 4.14 non-GKI 没有 GKI 模块加载基础设施
            if ! grep -q 'kernelsu' drivers/Makefile; then
              echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
              echo "  ✓ drivers/Makefile: 追加 obj-\$(CONFIG_KSU) 行"
            else
              echo "  ⊘ drivers/Makefile: 已含 kernelsu"
            fi
          fi

          # 4.7 最终验证(无论是否已集成都要做)
          echo "===== 集成验证 ====="
          if [[ -d "$KERNEL_DIR/drivers/kernelsu" ]]; then
            COUNT=$(find "$KERNEL_DIR/drivers/kernelsu" -maxdepth 1 -type f | wc -l)
            echo "  ✓ drivers/kernelsu 存在: $COUNT 个文件"
            find "$KERNEL_DIR/drivers/kernelsu" -maxdepth 1 -type f | head -5
          else
            echo "::error::drivers/kernelsu 不存在,集成失败"
            exit 1
          fi
          if grep -q "kernelsu" "$KERNEL_DIR/drivers/Makefile" 2>/dev/null; then
            echo "  ✓ drivers/Makefile: kernelsu 已接入"
          else
            echo "::error::drivers/Makefile 未接入 kernelsu"
            exit 1
          fi
          if [[ -f "$KERNEL_DIR/drivers/kernelsu/Kconfig" ]]; then
            echo "  ✓ drivers/kconfig: Kconfig 文件就位"
          else
            echo "::warning::drivers/kernelsu/Kconfig 缺失(可能 menuconfig 里看不到 KSU)"
          fi

          echo "kernelsu-head=$KSU_HEAD" >> "$GITHUB_OUTPUT"
          echo "coral-head=$CORAL_HEAD" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 集成 SUSFS 内核补丁 + 非 GKI inline hooks
      # ============================================================
      - name: 集成 SUSFS v${{ env.SUSFS_VERSION }} 内核补丁 + 非 GKI inline hooks
        id: susfs
        timeout-minutes: 20
        env:
          SUSFS_REPO: ${{ inputs.susfs_repo || secrets.SUSFS_REPO || 'https://gitlab.com/simonpunk/susfs4ksu.git' }}
          # Pixel 4 XL 内核是 4.14 non-GKI,必须用 simonpunk/susfs4ksu 的 kernel-4.14 分支
          # (master/gki-* 系列是 5.10+/GKI,跟 4.14 不兼容)
          SUSFS_BRANCH: ${{ inputs.susfs_branch || secrets.SUSFS_BRANCH || 'kernel-4.14' }}
          GIT_HTTP_LOW_SPEED_LIMIT: '1000'
          GIT_HTTP_LOW_SPEED_TIME: '60'
        run: |
          set -euo pipefail
          cd "$WORK_DIR"

          # 1. clone SUSFS(幂等 + 超时)
          #    注意:upstream 没有 v1.5.5 / v2.3.0 这种"版本 tag",只按内核树分分支。
          #    这里的 SUSFS_VERSION 仅用于日志显示,实际取哪个分支由 SUSFS_BRANCH 决定。
          echo "Clone SUSFS: $SUSFS_REPO @ $SUSFS_BRANCH (kernel patches version v${SUSFS_VERSION})"
          if [[ -d susfs/.git ]]; then
            SUSFS_HEAD=$(git -C susfs rev-parse --short HEAD 2>/dev/null || echo "")
            if [[ -n "$SUSFS_HEAD" ]]; then
              echo "复用已有 susfs (HEAD=$SUSFS_HEAD)"
            else
              echo "susfs/.git 损坏,删除重 clone"
              rm -rf susfs
            fi
          fi
          if [[ ! -d susfs ]]; then
            attempt=0
            while [[ $attempt -lt 3 ]]; do
              attempt=$((attempt + 1))
              if git clone --depth=1 --branch "$SUSFS_BRANCH" \
                   --config http.lowSpeedLimit=$GIT_HTTP_LOW_SPEED_LIMIT \
                   --config http.lowSpeedTime=$GIT_HTTP_LOW_SPEED_TIME \
                   -- "$SUSFS_REPO" susfs; then
                break
              fi
              echo "  clone 失败,${attempt} 次后重试"
              sleep $((attempt * 5))
            done
            SUSFS_HEAD=$(git -C susfs rev-parse --short HEAD)
          fi
          echo "SUSFS HEAD: $SUSFS_HEAD"
          # 真实版本号(从 patches 源里 grep 出来,而不是 env 变量)
          grep -hE '^#define SUSFS_VERSION' "$WORK_DIR/susfs"/kernel_patches/include/linux/susfs.h 2>/dev/null | head -1 || true
          # kernel-4.14 头里没定义 SUSFS_VERSION(它在 Kconfig 里),不强求 grep 结果
          echo "SUSFS HEAD: $SUSFS_HEAD"

          # 2. 应用 SUSFS patches
          mapfile -t SUSFS_PATCHES < <(find "$WORK_DIR/susfs" -name "*.patch" -type f 2>/dev/null | sort)
          if [[ ${#SUSFS_PATCHES[@]} -gt 0 ]]; then
            echo "应用 ${#SUSFS_PATCHES[@]} 个 SUSFS patch ..."
            (
              cd "$KERNEL_DIR"
              for p in "${SUSFS_PATCHES[@]}"; do
                echo "  Apply: $(basename "$p")"
                if git apply --check "$p" 2>/dev/null; then
                  git apply "$p" && echo "    OK"
                else
                  git apply --3way "$p" 2>/dev/null && echo "    3-way OK" || \
                    echo "    skip"
                fi
              done
            )
          fi

          # 3. 复制 SUSFS 源码(fs/susfs/ 等)
          for src_dir in kernel_patches/fs kernel_patches/include kernel_patches/fs/susfs; do
            src="$WORK_DIR/susfs/$src_dir"
            if [[ -d "$src" ]]; then
              cp -rv "$src" "$KERNEL_DIR/" 2>/dev/null || true
            fi
          done
          # fallback: 找任何含 susfs 字样的目录
          mapfile -t SRC_DIRS < <(find "$WORK_DIR/susfs" -type d -name "*susfs*" 2>/dev/null)
          for d in "${SRC_DIRS[@]}"; do
            if [[ "$d" == *"/kernel"* ]]; then
              cp -rv "$d"/* "$KERNEL_DIR/" 2>/dev/null || true
              echo "复制: $d"
            fi
          done

          echo "susfs-head=$SUSFS_HEAD" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 设置 ccache 缓存(预热)
      # ============================================================
      - name: 设置 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coral-${{ github.run_id }}
          restore-keys: |
            ccache-coral-

      - name: 配置 ccache
        run: |
          ccache -M "$CCACHE_MAXSIZE"
          ccache -s
          ccache -z

      # ============================================================
      # 清理 out 输出目录
      # ============================================================
      - name: 清理 out 输出目录
        run: |
          rm -rf "$KERNEL_DIR/out"
          echo "out 已清理"
          ls "$KERNEL_DIR" | head

      # ============================================================
      # 缓存 factory.zip — 同一 build 跨 run 复用,2.2GB 不必每次重下
      # ============================================================
      - name: 计算 factory cache key
        id: factory-key
        run: |
          # 用 URL 末段(去掉路径和 .zip)做 key
          # 例:https://dl.google.com/.../coral-tp1a.220624.014-factory-8f60813e.zip
          #     -> coral-tp1a.220624.014-factory-8f60813e
          # 同一 build 切不同 CDN 镜像也能命中缓存
          BASENAME=$(basename "$FACTORY_URL" .zip)
          SAFE_KEY=$(echo "$BASENAME" | tr -c 'A-Za-z0-9.-' '-')
          echo "cache-key=$SAFE_KEY"
          echo "cache-key=$SAFE_KEY" >> "$GITHUB_OUTPUT"

      - name: 缓存工厂镜像
        id: cache-factory
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/factory.zip
          # 严格按 build 标识匹配,不会跨 build 误命中
          key: factory-${{ steps.factory-key.outputs.cache-key }}
          # 不要 restore-keys 前缀 fallback — 不同 build 的 boot.img 不能混用

      # ============================================================
      # 以原厂 stock .config 为基底
      # ============================================================
      - name: 以原厂 stock .config 为基底
        id: stockconfig
        env:
          # 兼容旧调用;真正生效的是顶层 env.FACTORY_URL
          FACTORY_URL: ${{ env.FACTORY_URL }}
        run: |
          set -euo pipefail
          cd "$WORK_DIR"

          # 1. 下载工厂镜像(不存在或 < 1MB 都视为无效,重下)
          if [[ ! -s factory.zip ]] || [[ $(stat -c%s factory.zip 2>/dev/null || echo 0) -lt 1048576 ]]; then
            rm -f factory.zip
            echo "下载工厂镜像: $FACTORY_URL"
            # --connect-timeout / --max-time 防止挂死
            if ! curl -fL --retry 3 --retry-delay 5 \
                 --connect-timeout 30 --max-time 1800 \
                 -o factory.zip "$FACTORY_URL"; then
              echo "::error::工厂镜像下载失败"
              echo "FACTORY_URL=$FACTORY_URL"
              echo "常见原因:"
              echo "  - URL 拼错或 build ID 不属于本设备(例:coral 不能用 sargo 的 SP2A build)"
              echo "  - 网络问题 / Google CDN 不可达"
              echo "  - 文件大于 2GB,需保证 runner 磁盘充足"
              exit 1
            fi
          fi

          # 2. 校验下载完整性
          SZ=$(stat -c%s factory.zip)
          echo "factory.zip: $(numfmt --to=iec --suffix=B $SZ)"
          if [[ $SZ -lt 1048576 ]]; then
            echo "::error::factory.zip 太小($SZ 字节),不像有效 factory 镜像"
            file factory.zip || true
            exit 1
          fi

          # 3. 解压
          mkdir -p factory_extracted
          rm -rf factory_extracted/*
          unzip -q -o factory.zip -d factory_extracted
          echo "factory_extracted 内容:"
          ls factory_extracted/

          # 2. 找 stock boot.img
          BOOT_IMG=$(find factory_extracted -name boot.img | head -n 1)
          if [[ -z "$BOOT_IMG" ]]; then
            echo "ERROR: factory 镜像里找不到 boot.img"
            exit 1
          fi
          echo "stock boot.img: $BOOT_IMG"
          cp "$BOOT_IMG" "$WORK_DIR/stock-boot.img"

          # 3. 解包 stock boot.img(用 mkbootimg 工具)
          mkdir -p "$WORK_DIR/stock_boot"
          cd "$WORK_DIR/stock_boot"
          wget -q https://raw.githubusercontent.com/osm0sis/AnyKernel3/master/tools/mkbootimg
          wget -q https://raw.githubusercontent.com/osm0sis/AnyKernel3/master/tools/unpackbootimg
          chmod +x mkbootimg unpackbootimg

          ./unpackbootimg -i "$WORK_DIR/stock-boot.img" -o .
          ls

          # 4. 提取 stock 内核的 .config(通过 extract-ikconfig 脚本)
          if [[ -f boot.img-zImage ]]; then
            (
              cd "$KERNEL_DIR"
              if [[ -x scripts/extract-ikconfig ]]; then
                scripts/extract-ikconfig "$WORK_DIR/stock_boot/boot.img-zImage" > stock_ikconfig.txt
                echo "stock .config 提取成功: $(wc -l < stock_ikconfig.txt) 行"
                head -5 stock_ikconfig.txt
              else
                echo "WARNING: scripts/extract-ikconfig 不存在"
              fi
            )
          fi

          echo "stockboot-img=$WORK_DIR/stock-boot.img" >> "$GITHUB_OUTPUT"
          echo "stockboot-dir=$WORK_DIR/stock_boot" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 开启 BakaSU + SUSFS 配置
      # ============================================================
      - name: 开启 BakaSU + SUSFS 配置
        env:
          PATH: ${{ env.CLANG_DIR }}/bin:/usr/bin:/bin
        run: |
          cd "$KERNEL_DIR"

          # 1. 以 stock config 为基底
          if [[ -s stock_ikconfig.txt ]]; then
            cp stock_ikconfig.txt .config
            echo "使用 stock .config"
          else
            # DEFCONFIG_NAME 由前面的步骤探测并 export 到 env(Pixel 4/4 XL 用 floral,
            # Pixel 4a 用 sunfish,其他设备按 BOARD_* 探测)
            DC="${DEFCONFIG_NAME:-floral_defconfig}"
            echo "stock .config 不可用,用 $DC"
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "$DC"
          fi

          # 2. 开启 BakaSU(KernelSU)配置
          ./scripts/config --file .config --enable KSU || echo "  CONFIG_KSU 跳过"
          ./scripts/config --file .config --enable KSU_DEBUG || true
          # KSU_SUCOMPAT: BakaSU 的"内置 su" — kprobe execve 拦截,无需 userspace su 二进制
          ./scripts/config --file .config --enable KSU_SUCOMPAT || echo "  CONFIG_KSU_SUCOMPAT 跳过"
          ./scripts/config --file .config --enable KSU_SUCOMPAT_DEBUG || true
          # 4.14 non-GKI 没有 GKI 模块基础设施,KSU 必须是 obj-y 编进 vmlinux
          # 这里不需要配 CONFIG_KSU=m — 我们的 Makefile 写的是 obj-$(CONFIG_KSU) += kernelsu/
          # =m 会让 KSU 编成 .ko 但加载需要 initcall,而 4.14 没有 — 编译会过但运行时失败

          # 3. 开启 SUSFS 配置(具体 Kconfig 名以实际为准)
          for opt in SUSFS SUSFS_SUS_MAP SUSFS_SUS_SU \
                     SUSFS_SUS_OVERLAYFS SUSFS_HIDE_BOOTPROGS \
                     SUSFS_HIDE_PROPS SUSFS_HIDE_APKS; do
            ./scripts/config --file .config --enable "$opt" 2>/dev/null || true
          done

          # 4. 让 Kconfig 重新解析
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "==== BakaSU + SUSFS 配置 ===="
          grep -E "CONFIG_KSU|CONFIG_SUSFS" .config | head -40 || true

          if ! grep -q "CONFIG_KSU=y" .config; then
            echo "WARNING: CONFIG_KSU 未开启,KernelSU 可能没集成"
          fi

      # ============================================================
      # 编译 Image.gz-dtb
      # ============================================================
      - name: 编译 Image.gz-dtb (clang ${{ env.CLANG_VERSION }} + GNU binutils, 内置 BakaSU + SUSFS)
        env:
          PATH: ${{ env.CLANG_DIR }}/bin:/usr/bin:/bin
          CC: clang
          CXX: clang++
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          # 上一步设置的(优先用 wrapper,否则用 build.config 路径)
          BUILD_CONFIG: ${{ env.BUILD_CONFIG_PATH }}
          BUILD_WRAPPER: ${{ env.BUILD_WRAPPER }}
        run: |
          cd "$KERNEL_DIR"

          echo "==== 工具链版本 ===="
          clang --version
          aarch64-linux-gnu-gcc --version | head -n 1
          ld --version | head -n 1

          echo "==== ccache(编译前)===="
          ccache -s

          echo "==== 开始编译 ===="
          echo "  BUILD_CONFIG=$BUILD_CONFIG"
          echo "  BUILD_WRAPPER=$BUILD_WRAPPER"

          # 三种调用方式,按优先级:
          #   1. 有 wrapper(build_floral.sh / build_sunfish.sh)— 直接调它
          #      wrapper 内部已经设了 BUILD_CONFIG=private/msm-google/...
          #      这是 PixelExperience / msnx 这类 fork 的标准入口
          #   2. 没有 wrapper 但有 build.sh — 用 build/build.sh 配合 BUILD_CONFIG
          #   3. 都没有 — 退到 make,自己设 DEFCONFIG
          if [[ -n "$BUILD_WRAPPER" ]] && [[ -f "$BUILD_WRAPPER" ]]; then
            echo "→ 用 wrapper: bash $BUILD_WRAPPER"
            bash "$BUILD_WRAPPER" 2>&1 | tee "$WORK_DIR/build.log"
          elif [[ -x ./build/build.sh ]] || [[ -f ./build/build.sh ]]; then
            echo "→ 用 build/build.sh + BUILD_CONFIG=$BUILD_CONFIG"
            ./build/build.sh 2>&1 | tee "$WORK_DIR/build.log"
          else
            echo "→ 没有 build.sh,直接 make"
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
                 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
                 O=out -j"$(nproc)" \
                 ${DEFCONFIG_NAME:-floral_defconfig} olddefconfig \
                 2>&1 | tee "$WORK_DIR/build.log"
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
                 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
                 O=out -j"$(nproc)" \
                 Image.gz-dtb dtbo.img modules 2>&1 | tee -a "$WORK_DIR/build.log"
          fi

          echo "==== 产物 ===="
          ls -lh out/arch/arm64/boot/ 2>/dev/null || {
            echo "::error::编译后产物目录不存在"
            echo "  最后 50 行 build.log:"
            tail -n 50 "$WORK_DIR/build.log" 2>/dev/null || true
            exit 1
          }
          echo ""
          echo "==== ccache(编译后)===="
          ccache -s

      # ============================================================
      # 打包 new-boot.img(保留原版 v2 DTB 区)
      # ============================================================
      - name: 打包 new-boot.img (保留原版 v2 DTB 区)
        run: |
          cd "$WORK_DIR/stock_boot"

          NEW_KERNEL="$KERNEL_DIR/out/arch/arm64/boot/Image.gz-dtb"
          if [[ ! -f "$NEW_KERNEL" ]]; then
            echo "ERROR: new kernel Image.gz-dtb 不存在"
            ls "$KERNEL_DIR/out/arch/arm64/boot/" || true
            exit 1
          fi

          # 读取 stock boot.img 的元信息
          BASE=$(cat boot.img-base 2>/dev/null | tr -d '\n')
          PAGESIZE=$(cat boot.img-pagesize 2>/dev/null | tr -d '\n')
          CMDLINE=$(cat boot.img-cmdline 2>/dev/null | tr -d '\n')
          KERNEL_OFFSET=$(cat boot.img-kernel_offset 2>/dev/null | tr -d '\n')
          RAMDISK_OFFSET=$(cat boot.img-ramdisk_offset 2>/dev/null | tr -d '\n')
          TAGS_OFFSET=$(cat boot.img-tags_offset 2>/dev/null | tr -d '\n')
          SECOND_OFFSET=$(cat boot.img-second_offset 2>/dev/null | tr -d '\n')

          echo "stock 元信息:"
          echo "  base=$BASE"
          echo "  pagesize=$PAGESIZE"
          echo "  cmdline=$CMDLINE"
          echo "  kernel_offset=$KERNEL_OFFSET"

          # 保留原版 v2 DTB 区(关键:custom 内核可能没正确生成 DTB)
          DTB_ARG=""
          if [[ -f boot.img-dtb ]]; then
            DTB_ARG="--dtb boot.img-dtb"
            echo "使用 stock v2 DTB: $(ls -lh boot.img-dtb)"
          else
            echo "WARN: stock boot.img-dtb 不存在,使用 new kernel 自带 DTB"
          fi

          # 打包
          ./mkbootimg \
            --kernel "$NEW_KERNEL" \
            --ramdisk ramdisk.cpio.gz \
            --cmdline "$CMDLINE" \
            --base "$BASE" \
            --pagesize "$PAGESIZE" \
            --kernel_offset "$KERNEL_OFFSET" \
            --ramdisk_offset "$RAMDISK_OFFSET" \
            --tags_offset "$TAGS_OFFSET" \
            --second_offset "$SECOND_OFFSET" \
            $DTB_ARG \
            --output "$OUT_DIR/new-boot.img"

          ls -lh "$OUT_DIR/new-boot.img"

          # 校验
          ./unpackbootimg -i "$OUT_DIR/new-boot.img" -o $WORK_DIR/new_boot_unpacked 2>&1 | head
          ls $WORK_DIR/new_boot_unpacked/

      # ============================================================
      # 下载 BakaSU ksud prebuilt(从 kernelsu_repo 的 GitHub release)
      # ============================================================
      - name: 下载 BakaSU ksud prebuilt
        id: ksud-dl
        # ksud 是 BakaSU/KernelSU 的 userspace 守护进程,通常随 release 一起发布。
        # 内核模块编进 zImage 后,运行时必须配套 ksud 才能 mount 模块、管理 su 权限。
        # tag 留空就用最新 release(便于日常构建);正式发版可锁定具体 tag 复现。
        timeout-minutes: 10
        env:
          KSU_REPO_URL: ${{ inputs.kernelsu_repo || secrets.BAKASU_REPO || 'https://github.com/backslashxx/KernelSU' }}
          KSU_TAG: ${{ inputs.kernelsu_release_tag || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$WORK_DIR"

          # 1. 从仓库 URL 解析 owner/repo(支持 .git 后缀、https:// 与 git@ 形式)
          OWNER=$(printf '%s' "$KSU_REPO_URL" | sed -E 's#.*github\.com[:/]([^/]+)/([^/.]+)(\.git)?$#\1#')
          REPO=$(printf '%s' "$KSU_REPO_URL"  | sed -E 's#.*github\.com[:/]([^/]+)/([^/.]+)(\.git)?$#\2#')
          if [[ -z "$OWNER" || -z "$REPO" ]]; then
            echo "::error::解析仓库 owner/repo 失败: $KSU_REPO_URL"
            exit 1
          fi
          echo "仓库: $OWNER/$REPO"

          # 2. 选 API:指定 tag 用 /releases/tags/<tag>,否则 /releases/latest
          if [[ -n "$KSU_TAG" ]]; then
            API_URL="https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${KSU_TAG}"
            echo "→ 指定 tag: $KSU_TAG"
          else
            API_URL="https://api.github.com/repos/${OWNER}/${REPO}/releases/latest"
            echo "→ 用最新 release"
          fi

          # 3. 调 API 拿 release JSON(带 token 提高 rate limit)
          AUTH_ARGS=()
          if [[ -n "$GITHUB_TOKEN" ]]; then
            AUTH_ARGS=(-H "Authorization: token $GITHUB_TOKEN")
          fi
          echo "GET $API_URL"
          RELEASE_JSON=$(curl -fsSL "${AUTH_ARGS[@]}" "$API_URL") || {
            echo "::error::GitHub API 调用失败"
            echo "  检查项:"
            echo "    - repo 不存在或私有(无权访问):$OWNER/$REPO"
            echo "    - tag 不存在: $KSU_TAG"
            echo "    - GITHUB_TOKEN 缺失或失效"
            exit 1
          }
          TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name // ""')
          if [[ -z "$TAG_NAME" ]]; then
            echo "::error::release JSON 没 tag_name,可能 API 返回了错误页面"
            printf '%s' "$RELEASE_JSON" | head -20
            exit 1
          fi
          echo "Release tag: $TAG_NAME"

          # 4. 找 ksud 资产
          #    优先级:1) 名字含 ksud 且含 android/arm64/aarch64;2) 仅含 ksud
          #    用 jq 安全解析 JSON,避免 grep -oE 在多行字符串里出错
          KSUD_ASSET=$(printf '%s' "$RELEASE_JSON" | jq -r '
            [.assets[]?
             | select((.name | test("ksud"; "i"))
                     and (.name | test("android|arm64|aarch64"; "i")))]
              + [.assets[]?
                 | select(.name | test("ksud"; "i"))]
            | .[0].browser_download_url // empty
          ')
          if [[ -z "$KSUD_ASSET" ]]; then
            echo "::warning::Release $TAG_NAME 没找到 ksud 资产"
            echo "  该 release 全部资产:"
            printf '%s' "$RELEASE_JSON" | jq -r '.assets[]? | "    - \(.name) (\(.size) bytes)"'
            echo "  → 跳过 ksud 打包,继续构建(AnyKernel3 不会含 ksud)"
            echo "ksud-tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "ksud-asset=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ksud 资源: $KSUD_ASSET"

          # 5. 下载(用 .bin 后缀,magic 让 file 命令能识别)
          mkdir -p "$OUT_DIR"
          KSUD_TMP="$WORK_DIR/ksud-release.bin"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 300 \
            -o "$KSUD_TMP" "$KSUD_ASSET" || {
            echo "::error::ksud 下载失败"
            exit 1
          }
          echo "下载完成: $(ls -lh "$KSUD_TMP")"
          file "$KSUD_TMP" || true

          # 6. 判断是单文件还是压缩包
          #    - zip:通常含 ksud + Manager.apk 的 release zip
          #    - gzip/xz:tar 归档
          #    - ELF:直接是二进制(罕见)
          KSUD_FINAL="$OUT_DIR/ksud"
          FTYPE=$(file -b "$KSUD_TMP" 2>/dev/null || echo unknown)
          echo "文件类型: $FTYPE"

          case "$FTYPE" in
            *Zip*|*zip*)
              mkdir -p ksud-extracted
              if ! unzip -o -q "$KSUD_TMP" -d ksud-extracted; then
                echo "::error::zip 解压失败"
                exit 1
              fi
              # 优先找可执行文件 ksud,再退到 *ksud*
              KSUD_BIN=$(find ksud-extracted -type f \( -name "ksud" -o -name "ksud-*" \) | head -1)
              if [[ -z "$KSUD_BIN" ]]; then
                echo "::warning::zip 里没 ksud 二进制"
                find ksud-extracted -maxdepth 3 -type f | head -20
                echo "  跳过"
                exit 0
              fi
              cp "$KSUD_BIN" "$KSUD_FINAL"
              ;;
            *gzip*|*XZ*|*bzip2*)
              mkdir -p ksud-extracted
              tar -xf "$KSUD_TMP" -C ksud-extracted 2>/dev/null || {
                echo "::error::归档解压失败"
                exit 1
              }
              KSUD_BIN=$(find ksud-extracted -type f \( -name "ksud" -o -name "ksud-*" \) | head -1)
              if [[ -z "$KSUD_BIN" ]]; then
                echo "::warning::归档里没 ksud 二进制"
                exit 0
              fi
              cp "$KSUD_BIN" "$KSUD_FINAL"
              ;;
            *ELF*|*executable*)
              # 直接是二进制,改名即可
              cp "$KSUD_TMP" "$KSUD_FINAL"
              ;;
            *)
              echo "::warning::未知文件类型:$FTYPE,原样保存"
              cp "$KSUD_TMP" "$KSUD_FINAL"
              ;;
          esac

          chmod +x "$KSUD_FINAL"

          echo "==== ksud 已就绪 ===="
          ls -lh "$KSUD_FINAL"
          file "$KSUD_FINAL" || true
          sha256sum "$KSUD_FINAL" 2>/dev/null | head -c 16 && echo "..."

          # 7. 顺手做基本健康检查(版本字符串 / 报错信息)
          if "$KSUD_FINAL" --help 2>&1 | head -5; then
            echo "  ✓ ksud 可执行"
          else
            echo "  ::warning::ksud 启动测试未通过(可能是 Android-only 链接库)"
          fi

          echo "ksud-tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "ksud-asset=$KSUD_ASSET" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 制作 AnyKernel3 卡刷包
      # ============================================================
      - name: 制作 AnyKernel3 卡刷包
        env:
          AK3_REPO: ${{ inputs.anykernel3_repo || secrets.ANYKERNEL3_REPO || '' }}
        run: |
          AK3_DIR="$WORK_DIR/AnyKernel3"

          # 1. clone AnyKernel3 模板
          if [[ -n "$AK3_REPO" ]]; then
            echo "使用自定义 AnyKernel3: $AK3_REPO"
            git clone --depth=1 "$AK3_REPO" "$AK3_DIR"
          else
            echo "使用默认 AnyKernel3 模板(osm0sis/AnyKernel3)"
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK3_DIR"
          fi

          # 2. 复制新内核
          cp "$KERNEL_DIR/out/arch/arm64/boot/Image.gz-dtb" "$AK3_DIR/zImage"

          # 3. 复制 ramdisk(用 stock 的,通常 custom 内核不重新打包 ramdisk)
          if [[ -f "$WORK_DIR/stock_boot/ramdisk.cpio.gz" ]]; then
            cp "$WORK_DIR/stock_boot/ramdisk.cpio.gz" "$AK3_DIR/ramdisk.cpio.gz" 2>/dev/null || true
          fi

          # 4. 复制 dtb(保留原厂 v2 DTB)
          if [[ -f "$WORK_DIR/stock_boot/boot.img-dtb" ]]; then
            cp "$WORK_DIR/stock_boot/boot.img-dtb" "$AK3_DIR/dtb" 2>/dev/null || true
          fi

          # 4.5 复制 ksud(BakaSU userspace 守护进程)
          #      没有它,kernel 模块加载不了,刷进去内核启不来 su,所以临时用 KSUD
          #      复制到 AK3_DIR/ksud/,AnyKernel3 会保留目录结构
          if [[ -f "$OUT_DIR/ksud" ]]; then
            mkdir -p "$AK3_DIR/ksud"
            cp "$OUT_DIR/ksud" "$AK3_DIR/ksud/ksud"
            chmod +x "$AK3_DIR/ksud/ksud"
            echo "  ✓ ksud 已加入 AnyKernel3: $(ls -lh "$AK3_DIR/ksud/ksud" | awk '{print $5}')"
            # 写个说明,免得用户不知道目录里是啥
            cat > "$AK3_DIR/ksud/README.md" <<'EOF'
          # ksud — BakaSU/KernelSU userspace daemon

          这是与内核模块配套的用户态守护进程。

          ## 安装(必须)
          ```sh
          adb push ksud /data/local/tmp/
          adb shell su -c "mkdir -p /data/adb/ksud"
          adb shell su -c "cp /data/local/tmp/ksud /data/adb/ksud/ksud"
          adb shell su -c "chmod 755 /data/adb/ksud/ksud"
          adb shell su -c "/data/adb/ksud/ksud --help"   # 验证
          ```

          ## 升级(以后 OTA)
          直接覆盖 `/data/adb/ksud/ksud` 即可,kernel 模块和 daemon 版本要匹配。
          EOF
          else
            echo "  ⊘ 未提供 ksud,AnyKernel3 不含(检查 kernelsu_release_tag 输入)"
          fi

          # 5. 清理 .git
          rm -rf "$AK3_DIR/.git"

          # 6. 打包 zip
          cd "$AK3_DIR"
          ZIP_NAME="AnyKernel3-coral-$(date +%Y%m%d-%H%M%S).zip"
          zip -r "$OUT_DIR/$ZIP_NAME" . -x "*.git*"

          echo "==== 产物 ===="
          ls -lh "$OUT_DIR/"

      # ============================================================
      # 上传产物
      # ============================================================
      - name: 上传 new-boot.img
        uses: actions/upload-artifact@v4
        with:
          name: new-boot-${{ github.sha }}
          path: ${{ env.OUT_DIR }}/new-boot.img
          retention-days: 14
          if-no-files-found: error

      - name: 上传 AnyKernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-${{ github.sha }}
          path: ${{ env.OUT_DIR }}/AnyKernel3-coral-*.zip
          retention-days: 14
          if-no-files-found: warn

      - name: 上传 ccache 统计 + build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ github.sha }}
          path: |
            ${{ env.WORK_DIR }}/build.log
          retention-days: 7
          if-no-files-found: warn

      # ============================================================
      # Post
      # ============================================================
      - name: Post 设置 ccache 缓存
        if: always()
        run: |
          echo "==== ccache 统计 ===="
          ccache -s
          echo ""
          echo "ccache 大小:"
          du -sh "$CCACHE_DIR" 2>/dev/null || echo "(空)"

      - name: Post 检出 fork 仓库源码(状态汇总)
        if: always()
        run: |
          echo "==== GitHub Actions 工作目录 ===="
          ls -la "$GITHUB_WORKSPACE"
          echo ""
          echo "==== 工作目录 ===="
          ls -la "$WORK_DIR"
          echo ""
          echo "==== 产物 ===="
          ls -la "$OUT_DIR"
          echo ""
          echo "==== build.log 最后 50 行 ===="
          tail -n 50 "$WORK_DIR/build.log" 2>/dev/null || echo "(无 build.log)"

      # ============================================================
      # tag 触发时创建 GitHub Release
      # ============================================================
      - name: 创建 GitHub Release (仅 tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KSU_HEAD: ${{ steps.bakasu.outputs.kernelsu-head }}
          SUSFS_HEAD: ${{ steps.susfs.outputs.susfs-head }}
          CORAL_HEAD: ${{ steps.bakasu.outputs.coral-head }}
          KSUD_TAG: ${{ steps.ksud-dl.outputs.ksud-tag }}
        run: |
          printf '%s\n' \
            '## Pixel 4XL (coral) 内核构建' \
            '' \
            "- **Tag**: \`${{ github.ref_name }}\`" \
            "- **Commit**: \`${{ github.sha }}\`" \
            "- **触发**: ${{ github.event_name }} by @${{ github.actor }}" \
            '' \
            '### 组件版本' \
            "- **coral kernel**: \`${CORAL_HEAD}\`" \
            "- **KernelSU/BakaSU**: \`${KSU_HEAD}\`" \
            "- **SUSFS**: \`${SUSFS_HEAD}\`" \
            "- **ksud**: ${KSUD_TAG:-N/A}" \
            "- **Linux kernel**: $(cat $KERNEL_DIR/include/config/kernel.release 2>/dev/null || echo N/A)" \
            '' \
            '### 产物' \
            '- `new-boot.img` — boot 镜像,保留原厂 v2 DTB' \
            '- `AnyKernel3-coral-*.zip` — TWRP 卡刷包(内置 ksud)' \
            '' \
            '### 刷机方法' \
            '1. TWRP recovery → Install → 选 zip' \
            '2. 或 fastboot: `fastboot flash boot new-boot.img`' \
            '3. 首次启动后手动部署 ksud: `adb push ksud /data/local/tmp && adb shell su -c "cp /data/local/tmp/ksud /data/adb/ksud/ksud && chmod 755 /data/adb/ksud/ksud"`' \
            > "$WORK_DIR/release_notes.md"

          cat "$WORK_DIR/release_notes.md"

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Pixel 4XL Kernel ${{ github.ref_name }}"
          body_path: ${{ env.WORK_DIR }}/release_notes.md
          files: |
            ${{ env.OUT_DIR }}/new-boot.img
            ${{ env.OUT_DIR }}/AnyKernel3-coral-*.zip
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}